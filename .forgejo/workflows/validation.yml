name: Scheduled validation
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
concurrency:
  group: hvac-scheduled-validation
  cancel-in-progress: false
jobs:
  oracle:
    runs-on: security
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reproduce pinned schema-validated OpenStudio design loads
        run: node tools/regenerate-oracle.mjs
      - name: Retain generated oracle evidence
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: regenerated-oracle
          path: dist/oracle
  dependencies:
    runs-on: security
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Native scan prerequisites
        run: sh tools/install-linux-ci.sh
      - name: Scan reachable Go dependencies including desktop build tags
        run: |
          mkdir -p dist/security
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck -tags desktop,production,webkit2_41 ./... > dist/security/govulncheck.txt 2>&1
      - name: Scan frontend dependencies
        if: always()
        working-directory: app/frontend
        run: |
          npm ci
          npm audit --audit-level=high --json > ../../dist/security/npm-audit.json
      - name: Retain scan reports
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: dependency-scans
          path: dist/security
